<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Бюджет</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#3b82f6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Бюджет">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="shared/core.css">
<style>
/* своё у версии с Supabase; общий интерфейс в shared/core.css */
.logout-btn, .refresh-btn {
  background: none; border: 1px solid var(--border);
  border-radius: 6px; width: 30px; height: 30px;
  cursor: pointer; font-size: 14px; color: var(--muted);
  display: flex; align-items: center; justify-content: center;
  transition: color .12s, border-color .12s;
  flex-shrink: 0;
}
.logout-btn:hover { color: var(--red); border-color: var(--red); }
.refresh-btn { font-size: 17px; }
.refresh-btn:hover { color: var(--blue); border-color: var(--blue); }
.refresh-btn:disabled { cursor: default; }
.refresh-btn.spin { color: var(--blue); border-color: var(--blue); }
.refresh-btn.spin span { animation: spin .7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ── Login ── */
.login-overlay {
  position: fixed; inset: 0;
  background: var(--bg);
  z-index: 900;
  display: flex; align-items: center; justify-content: center;
  padding: 20px;
}
.login-box {
  background: var(--surface); border-radius: 14px;
  box-shadow: var(--shadow);
  padding: 28px 24px;
  width: 100%; max-width: 340px;
  display: flex; flex-direction: column; gap: 14px;
}
.login-box h2 { font-size: 18px; font-weight: 700; text-align: center; }
.login-box input {
  border: 1.5px solid var(--border); border-radius: 8px;
  padding: 11px 12px; font-size: 16px; font-family: inherit;
  color: var(--text); background: var(--surface); width: 100%;
}
.login-box input:focus { outline: none; border-color: var(--blue); }
.login-err { color: var(--red); font-size: 13px; text-align: center; min-height: 18px; }
</style>
</head>
<body>

<!-- Login -->
<div id="login-overlay" class="login-overlay hidden">
  <form class="login-box" onsubmit="doLogin(event)">
    <h2>Бюджет</h2>
    <input type="email" id="login-email" placeholder="Почта" autocomplete="username" required>
    <input type="password" id="login-pass" placeholder="Пароль" autocomplete="current-password" required>
    <p class="login-err" id="login-err"></p>
    <button class="btn-primary" id="login-btn" type="submit">Войти</button>
  </form>
</div>

<div id="sync-dot"></div>

<div id="app" class="hidden">

<header>
  <h1>Бюджет</h1>
  <div class="month-nav">
    <button class="nav-btn" onclick="shiftMonth(-1)">‹</button>
    <div class="cal-wrapper">
      <button id="month-label" class="month-label-btn" onclick="toggleCalendar(event)">
        <span id="month-label-text"></span>
        <span class="cal-drop-arrow">▾</span>
      </button>
      <div id="cal-popup" class="cal-popup hidden">
        <div class="cal-year-nav">
          <button class="cal-year-btn" onclick="calPickYear(-1)">‹</button>
          <span id="cal-year-display"></span>
          <button class="cal-year-btn" onclick="calPickYear(1)">›</button>
        </div>
        <div id="cal-months-grid" class="cal-months"></div>
      </div>
    </div>
    <button class="nav-btn" onclick="shiftMonth(1)">›</button>
  </div>
  <div class="header-actions">
    <button class="refresh-btn" id="refresh-btn" title="Обновить данные" onclick="refreshData()"><span>⟳</span></button>
    <button class="logout-btn" title="Выйти" onclick="doLogout()">⏻</button>
  </div>
</header>

<!-- Confirm modal -->
<div id="confirm-overlay" class="modal-overlay hidden">
  <div class="confirm-box">
    <p class="confirm-title" id="confirm-title"></p>
    <p class="confirm-name" id="confirm-name"></p>
    <div class="confirm-btns">
      <button class="confirm-cancel" onclick="closeConfirm()">Отмена</button>
      <button class="confirm-ok" id="confirm-ok" onclick="execConfirm()"></button>
    </div>
  </div>
</div>

<main>

  <!-- Empty state -->
  <div id="empty-state" class="empty-state hidden">
    <h2 id="empty-title"></h2>
    <p>Данных пока нет — создай бюджет для этого месяца</p>
    <label class="copy-option" id="copy-option" style="display:none">
      <input type="checkbox" id="copy-cb"> Скопировать план из предыдущего месяца
    </label>
    <button class="btn-primary" onclick="createCurrentMonth()">Создать бюджет</button>
  </div>

  <!-- Budget view -->
  <div id="budget-view" class="hidden">

    <!-- Summary -->
    <div class="summary">
      <div class="s-card">
        <div class="s-card-label">Получено</div>
        <div class="s-card-val" id="s-income">0 ₽</div>
      </div>
      <div class="s-card">
        <div class="s-card-label">Обязательные</div>
        <div class="s-card-val" id="s-mandatory">0 ₽</div>
      </div>
      <div class="s-card">
        <div class="s-card-label">Потрачено</div>
        <div class="s-card-val" id="s-spent">0 ₽</div>
      </div>
      <div class="s-card">
        <div class="s-card-label">Отложено</div>
        <div class="s-card-val" id="s-saved">0 ₽</div>
      </div>
      <div class="s-card accent" id="s-remain-card">
        <div class="s-card-label">Остаток</div>
        <div class="s-card-val" id="s-remain">0 ₽</div>
      </div>
    </div>

    <!-- Income & Savings -->
    <div class="section">
      <div class="section-header">
        <h2>Доходы и накопления</h2>
      </div>
      <div class="income-grid">
        <div class="income-field">
          <label>Получено в этом месяце</label>
          <input type="number" inputmode="decimal" id="income-inp" placeholder="0 ₽"
            onblur="saveMonthFields()" onkeydown="enterBlur(event)">
        </div>
        <div class="income-field">
          <label>Отложено в этом месяце</label>
          <input type="number" inputmode="decimal" id="saved-inp" placeholder="0 ₽"
            onblur="saveMonthFields()" onkeydown="enterBlur(event)">
        </div>
      </div>
    </div>

    <!-- Mandatory -->
    <div class="section">
      <div class="section-header">
        <h2>Обязательные платежи</h2>
        <span class="section-total" id="mandatory-total"></span>
      </div>
      <table>
        <thead>
          <tr>
            <th class="col-cat">Категория</th>
            <th class="col-name">Название</th>
            <th class="r col-num">Сумма</th>
            <th class="col-del"></th>
          </tr>
        </thead>
        <tbody id="mandatory-body"></tbody>
      </table>
      <div class="add-row">
        <button class="add-btn" onclick="addEntry('mandatory')">+ Добавить платёж</button>
      </div>
    </div>

    <!-- Backlog -->
    <div class="section">
      <div class="section-header backlog-header" onclick="toggleBacklog()">
        <h2><span class="backlog-arrow" id="backlog-arrow">▸</span>Бэклог</h2>
        <span class="section-total" id="backlog-total"></span>
      </div>
      <div id="backlog-content" class="hidden">
        <table>
          <thead>
            <tr>
              <th class="col-cat">Категория</th>
              <th class="col-name">Название</th>
              <th class="r col-num">Сумма</th>
              <th class="col-move"></th>
              <th class="col-del"></th>
            </tr>
          </thead>
          <tbody id="backlog-body"></tbody>
        </table>
        <div class="add-row">
          <button class="add-btn" onclick="addBacklogEntry()">+ Добавить в бэклог</button>
        </div>
      </div>
    </div>

    <!-- Planned -->
    <div class="section">
      <div class="section-header">
        <h2>Планируемые траты</h2>
        <span class="section-total" id="planned-total"></span>
      </div>
      <div class="cat-tabs" id="cat-tabs"></div>
      <table>
        <thead>
          <tr>
            <th class="col-cat">Категория</th>
            <th class="col-name">Название</th>
            <th class="r col-num">План</th>
            <th class="r col-num">Факт</th>
            <th class="r col-num">Осталось</th>
            <th class="col-move"></th>
            <th class="col-del"></th>
          </tr>
        </thead>
        <tbody id="planned-body"></tbody>
        <tfoot id="planned-foot"></tfoot>
      </table>
      <div class="add-row">
        <button class="add-btn" onclick="addEntry('planned')">+ Добавить трату</button>
      </div>
    </div>

  </div><!-- /budget-view -->
</main>

</div><!-- /app -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.js"></script>
<script src="shared/core.js"></script>
<script>
// Версия с Supabase: общий бюджет с Настей, живая синхронизация между телефонами.
// Интерфейс и расчёты — в shared/core.js, здесь только хранилище, вход и realtime.

// ── Supabase ─────────────────────────────────────────────────────────────────
// anon/publishable key публичен по замыслу — доступ режет RLS (см. supabase_setup.sql)
const SUPABASE_URL = 'https://szegeqfiitlonzlpeohx.supabase.co';
const SUPABASE_KEY = 'sb_publishable_DW_bjZP12NIX2HJA8IVy2w__lffl5yi';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
  auth: { persistSession: true, autoRefreshToken: true },
});

cats = [
  { id: 'me',     name: 'Я',     color: '#3b82f6' },
  { id: 'nastya', name: 'Настя', color: '#ec4899' },
  { id: 'shared', name: 'Общие', color: '#10b981' },
];

// ── API (Supabase PostgREST) ─────────────────────────────────────────────────

// Любая ошибка запроса должна быть видна: молча потерянная правка хуже алерта.
function unwrap({ data, error }) {
  if (error) { flash('Ошибка: ' + error.message, true); throw error; }
  return data;
}

const api = {
  listMonths: () => sb.from('months').select('*')
    .order('year', { ascending: false })
    .order('month', { ascending: false })
    .order('half', { ascending: false })
    .then(unwrap),

  getMonth: async id => {
    const month = unwrap(await sb.from('months').select('*').eq('id', id).single());
    const entries = unwrap(await sb.from('entries').select('*').eq('month_id', id)
      .order('type').order('category').order('planned', { ascending: false }));
    return { month, entries };
  },

  createMonth: async (year, month, half, copyFromId) => {
    const res = await sb.from('months')
      .insert({ year, month, half, income: 0, saved: 0 }).select().single();
    if (res.error) {
      if (res.error.code === '23505') return { error: 'exists' };
      flash('Ошибка: ' + res.error.message, true);
      throw res.error;
    }
    const created = res.data;
    if (copyFromId) {
      const src = unwrap(await sb.from('entries')
        .select('type,category,name,planned').eq('month_id', copyFromId));
      if (src.length) {
        unwrap(await sb.from('entries').insert(
          src.map(e => ({ ...e, month_id: created.id, actual: 0 }))
        ));
      }
    }
    return created;
  },

  updateMonth: (id, patch) => sb.from('months').update(patch).eq('id', id).then(unwrap),

  createEntry: row => sb.from('entries').insert(row).select().single().then(unwrap),
  updateEntry: (id, patch) => sb.from('entries').update(patch).eq('id', id).then(unwrap),
  deleteEntry: id => sb.from('entries').delete().eq('id', id).then(unwrap),

  entryToBacklog: async eid => {
    const e = unwrap(await sb.from('entries').select('category,name,planned').eq('id', eid).single());
    const item = unwrap(await sb.from('backlog').insert(e).select().single());
    unwrap(await sb.from('entries').delete().eq('id', eid));
    return item;
  },

  listBacklog: () => sb.from('backlog').select('*')
    .order('category').order('planned', { ascending: false }).then(unwrap),
  createBacklog: row => sb.from('backlog').insert(row).select().single().then(unwrap),
  updateBacklog: (id, patch) => sb.from('backlog').update(patch).eq('id', id).then(unwrap),
  deleteBacklog: id => sb.from('backlog').delete().eq('id', id).then(unwrap),

  backlogToEntry: async (bid, monthId) => {
    const b = unwrap(await sb.from('backlog').select('category,name,planned').eq('id', bid).single());
    const entry = unwrap(await sb.from('entries')
      .insert({ ...b, month_id: monthId, type: 'planned', actual: 0 }).select().single());
    unwrap(await sb.from('backlog').delete().eq('id', bid));
    return entry;
  },
};

// ── auth ─────────────────────────────────────────────────────────────────────

async function doLogin(e) {
  e.preventDefault();
  const btn = $('login-btn');
  btn.disabled = true;
  $('login-err').textContent = '';
  const { error } = await sb.auth.signInWithPassword({
    email: $('login-email').value.trim(),
    password: $('login-pass').value,
  });
  btn.disabled = false;
  if (error) {
    $('login-err').textContent = error.message === 'Invalid login credentials'
      ? 'Неверная почта или пароль' : error.message;
    return;
  }
  $('login-pass').value = '';
  showApp();
}

async function doLogout() {
  await sb.removeAllChannels();
  await sb.auth.signOut();
  location.reload();
}

function showApp() {
  $('login-overlay').classList.add('hidden');
  $('app').classList.remove('hidden');
  init();
  subscribeRealtime();
}

function showLogin() {
  $('app').classList.add('hidden');
  $('login-overlay').classList.remove('hidden');
  $('login-email').focus();
}

// ── init ─────────────────────────────────────────────────────────────────────

function init() { return loadAll(); }

// Перечитывание по кнопке: дешевле полной перезагрузки страницы и не гоняет
// заново логин. Страховка на случай, если realtime что-то не довёз.
async function refreshData() {
  const btn = $('refresh-btn');
  if (btn.disabled) return;
  btn.disabled = true;
  btn.classList.add('spin');
  try {
    await init();
    flash('Обновлено');
  } finally {
    btn.disabled = false;
    btn.classList.remove('spin');
  }
}

// ── realtime ─────────────────────────────────────────────────────────────────
// Правки прилетают с другого телефона в живом режиме. Перерисовку откладываем,
// пока курсор стоит в поле: иначе чужое событие снесёт недописанную строку.

let rtChannel = null;
let renderQueued = false;

function queueRender() {
  if (isEditing()) { renderQueued = true; return; }
  renderQueued = false;
  renderAll();
  renderBacklog();
}

document.addEventListener('focusout', () => {
  setTimeout(() => {
    if (!renderQueued || isEditing()) return;
    queueRender();
  }, 150);
});

function onMonthsChange(payload) {
  const row = payload.new && payload.new.id ? payload.new : null;
  const oldId = payload.old && payload.old.id;

  if (payload.eventType === 'DELETE') {
    state.allMonths = state.allMonths.filter(m => m.id !== oldId);
    if (calOpen) renderCalendar();
    if (state.monthId === oldId) { state.monthId = null; loadCurrentMonth(); }
    return;
  }
  if (!row) return;

  const isNew = !state.allMonths.some(m => m.id === row.id);
  upsert(state.allMonths, row);
  if (calOpen) renderCalendar();

  if (row.id === state.monthId) {
    state.income = row.income;
    state.saved  = row.saved;
    const inc = $('income-inp'), sav = $('saved-inp');
    if (document.activeElement !== inc) inc.value = row.income || '';
    if (document.activeElement !== sav) sav.value = row.saved || '';
    renderSummary();
  } else if (isNew && state.monthId === null
      && row.year === state.year && row.month === state.month && row.half === state.half) {
    // период создали на другом устройстве, а мы смотрим на его пустой экран
    loadCurrentMonth();
  }
}

function onEntriesChange(payload) {
  if (payload.eventType === 'DELETE') {
    const oldId = payload.old && payload.old.id;
    if (!state.entries.some(e => e.id === oldId)) return;
    state.entries = state.entries.filter(e => e.id !== oldId);
    queueRender();
    return;
  }
  const row = payload.new;
  if (!row || row.month_id !== state.monthId) return;
  upsert(state.entries, row);
  queueRender();
}

function onBacklogChange(payload) {
  if (payload.eventType === 'DELETE') {
    const oldId = payload.old && payload.old.id;
    if (!state.backlog.some(b => b.id === oldId)) return;
    state.backlog = state.backlog.filter(b => b.id !== oldId);
  } else {
    const row = payload.new;
    if (!row) return;
    upsert(state.backlog, row);
  }
  if (isEditing()) { renderQueued = true; return; }
  renderBacklog();
}

function subscribeRealtime() {
  if (rtChannel) return;
  rtChannel = sb.channel('budget-sync')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'months'  }, onMonthsChange)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'entries' }, onEntriesChange)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'backlog' }, onBacklogChange)
    .subscribe(status => {
      // Обрыв не смертелен: остаётся перечитывание при возврате на вкладку.
      if (status === 'CHANNEL_ERROR' || status === 'TIMED_OUT') {
        flash('Живая синхронизация отключилась', true);
      }
    });
}

// Realtime мог пропустить события, пока вкладка спала — по возврату досинхрон.
document.addEventListener('visibilitychange', async () => {
  if (document.visibilityState !== 'visible') return;
  if ($('app').classList.contains('hidden')) return;
  if (isEditing()) return;
  await init();
});

// ── start ─────────────────────────────────────────────────────────────────────

(async () => {
  const { data: { session } } = await sb.auth.getSession();
  if (session) showApp(); else showLogin();
})();
</script>
</body>
</html>
