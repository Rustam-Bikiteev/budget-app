  <style>
    *{box-sizing:border-box}body{margin:0;background:#aaa0d0;color:#29272f;font-family:Arial,sans-serif}.reference-tools{display:flex;align-items:center;justify-content:space-between;gap:15px;padding:19px 30px;font-size:12px}.reference-tools a{color:inherit;text-decoration:none;border-bottom:1px solid #777080;padding-bottom:3px}.reference-stage{min-height:calc(100dvh - 64px);display:flex;align-items:center;justify-content:center;gap:36px;padding:20px 30px 55px}.handset{width:336px;height:720px;flex-shrink:0;border-radius:45px;overflow:hidden;background:#fcfcfc}.handset iframe{width:100%;height:100%;border:0}.reference-tools span{opacity:.75}@media(min-width:1450px){.handset{width:360px;height:770px}.reference-stage{gap:40px}}@media(max-width:1140px){.reference-stage{gap:22px;justify-content:flex-start;overflow-x:auto;padding:25px 26px 45px;scroll-snap-type:x mandatory}.handset{scroll-snap-align:center}.reference-tools{padding:18px 26px}}@media(max-width:500px){.reference-tools span{display:none}.reference-stage{min-height:0;height:calc(100dvh - 58px);align-items:flex-start;padding:12px 15px 20px;gap:15px}.handset{width:calc(100vw - 40px);height:calc(100dvh - 90px);border-radius:36px}}

</head>
